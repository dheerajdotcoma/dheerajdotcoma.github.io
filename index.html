<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app:head-->
    <meta name="theme-color" content="#F7F6FB" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Runs before first paint. Decides whether the intro overlay should cover the page, so the
      // content never flashes. Content is always in the DOM; this only hides it visually.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var q = location.search;
          var force = /[?&]intro=1/.test(q);
          var off = /[?&]intro=0/.test(q);
          var seen = sessionStorage.getItem('introSeen') === '1';
          var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          // A deep link (#projects etc.) goes straight to the content.
          if (force || (!off && !seen && !rm && !location.hash)) d.classList.add('intro-pending');
        } catch (e) {}
        // Failsafe: if the app script never boots, reveal the content anyway. main.js clears this.
        window.__introFailsafe = setTimeout(function () {
          d.classList.remove('intro-pending');
        }, 2500);
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <canvas id="nebula" aria-hidden="true"></canvas>
    <!--app:header-->
    <!--app:progress-->
    <main id="main" tabindex="-1">
      <!--app:main-->
    </main>
    <!--app:footer-->

    <div id="intro" aria-hidden="true">
      <div class="intro-loader"></div>
    </div>
    <button id="intro-skip" type="button" hidden>Skip intro <kbd>Esc</kbd></button>

    <!--app:modal-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
